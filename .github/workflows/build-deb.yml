name: Deb

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: python3 -m unittest discover -s Tests -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            suffix: rootless
          - scheme: roothide
            suffix: roothide
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - uses: actions/checkout@v6

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v2

      - name: Setup
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos \
            -o "$RUNNER_TEMP/install-theos.sh"
          bash "$RUNNER_TEMP/install-theos.sh"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate iOS SDK
        run: |
          set -euo pipefail
          sdk="$THEOS/sdks/iPhoneOS16.5.sdk"
          if [[ ! -f "$sdk/usr/lib/libz.tbd" ]]; then
            echo "iPhoneOS16.5 SDK is incomplete; downloading a clean copy."
            for attempt in 1 2 3; do
              rm -rf "$sdk"
              if "$THEOS/bin/install-sdk" iPhoneOS16.5 && [[ -f "$sdk/usr/lib/libz.tbd" ]]; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "iPhoneOS16.5 SDK is still incomplete after 3 attempts." >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

          test -f "$sdk/usr/lib/libz.tbd"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            DISABLE_ROOTLESS_COMPAT_WARNING=1

      - name: Name package
        id: name
        run: |
          deb="$(ls packages/*.deb | head -1)"
          version="$(awk '/^Version:/ {print $2}' control)"
          output="com.itzzace.ytkace_${version}_${{ matrix.suffix }}.deb"
          mkdir -p artifacts
          cp "$deb" "artifacts/$output"
          echo "deb=artifacts/$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-deb-${{ matrix.suffix }}
          path: ${{ steps.name.outputs.deb }}
          if-no-files-found: error
